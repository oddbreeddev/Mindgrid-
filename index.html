<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>MindGrid | Your Study Helper</title>
  
  <meta name="description" content="A simple and helpful place for Nigerian students to study for JAMB, WAEC, and learn tech skills.">
  <meta property="og:title" content="MindGrid Nigeria">
  <meta property="og:description" content="The easy way to study and grow your skills.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1531297484001-80022131f5a1?auto=format&fit=crop&q=80&w=1200">

  <script>
    // Robust process shim
    window.process = window.process || {};
    window.process.env = window.process.env || { NODE_ENV: 'production', API_KEY: '' };
    
    // Global error handler for mobile debugging
    window.onerror = function(msg, url, line, col, error) {
      var debugDiv = document.getElementById('mobile-debug');
      if (!debugDiv) {
        debugDiv = document.createElement('div');
        debugDiv.id = 'mobile-debug';
        debugDiv.style.position = 'fixed';
        debugDiv.style.top = '0';
        debugDiv.style.left = '0';
        debugDiv.style.width = '100%';
        debugDiv.style.background = 'rgba(255,0,0,0.9)';
        debugDiv.style.color = 'white';
        debugDiv.style.padding = '10px';
        debugDiv.style.fontSize = '10px';
        debugDiv.style.zIndex = '9999';
        debugDiv.style.wordBreak = 'break-all';
        document.body.appendChild(debugDiv);
      }
      debugDiv.innerHTML = 'Error: ' + msg + '<br>Line: ' + line + '<br>Stack: ' + (error ? error.stack : 'N/A');
      return false;
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="selection:bg-blue-600 selection:text-white">
  <div id="root">
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #050505; color: #3b82f6; font-family: sans-serif;">
      <p>Loading MindGrid...</p>
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
